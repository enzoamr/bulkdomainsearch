name: Sync aftermarket feed to Turso

# Rebuilds the for-sale (blue tier) index nightly: downloads the free GoDaddy
# Auctions inventory and loads it into Turso, which the Vercel app reads from.
# Vercel serverless can't hold the index in memory, so this runs here instead.
#
# Setup: add repo secrets TURSO_DATABASE_URL and TURSO_AUTH_TOKEN
# (Settings → Secrets and variables → Actions). Trigger the first run manually
# from the Actions tab, then it runs itself every night.

on:
  schedule:
    # 15:40 UTC — after GoDaddy rebuilds its files (~14:30 UTC).
    - cron: "40 15 * * *"
  workflow_dispatch: {}

# Don't pile up overlapping runs.
concurrency:
  group: aftermarket-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # No tight cap: the full inventory (~2M+ rows) can take a while to download
    # and load. GitHub's own 6h job ceiling still applies as a backstop.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download GoDaddy Auctions inventory
        # Some files decompress past 500MB; give Node headroom.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/godaddy-auctions-download.mjs

      - name: Load into Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/turso-load.mjs
